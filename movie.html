<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kinoplex — Filme</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="device">
  <div class="status-bar"><span>09:30 PM</span><div class="icons"></div></div>
  <div class="screen">
    <header class="app-header">
      <a class="icon-btn" href="index.html" aria-label="Voltar"></a>
      <div class="wordmark"><img src="assets/images/kinoplex-logo.png" alt="Kinoplex"></div>
      <a class="icon-btn" href="search.html" aria-label="Pesquisar"></a>
    </header>
    <div class="stub">
      <h2>Fluxo do filme — Parte 2</h2>
      <p>Essa página vai mostrar a jornada completa: informações do filme, seleção de cinema, data e sessões, mantendo o filme como contexto o tempo todo.</p>
      <a class="back-link" href="index.html">← Voltar para a Home</a>
    </div>
  </div>
  <nav class="bottom-nav">
    <a class="nav-item" href="index.html"><span class="nav-icon"></span>Home</a>
    <button class="nav-item"><span class="nav-icon"></span>Pedidos</button>
    <button class="nav-item"><span class="nav-icon"></span>Filmes</button>
    <button class="nav-item"><span class="nav-icon"></span>Lançamentos</button>
    <button class="nav-item"><span class="nav-icon"></span>Perfil</button>
  </nav>
</div>
<script src="assets/app.js"></script>
<script>
  document.querySelector('.status-bar .icons').innerHTML = ICONS.bluetooth + ICONS.wifi + ICONS.battery;
  document.querySelector('[aria-label="Voltar"]').innerHTML = ICONS.back;
  document.querySelector('[aria-label="Pesquisar"]').innerHTML = ICONS.search;
  const navIcons = [ICONS.home, ICONS.orders, ICONS.films, ICONS.launches, ICONS.profile];
  document.querySelectorAll('.nav-item .nav-icon').forEach((el,i) => el.innerHTML = navIcons[i]);
</script>
</body>
</html>
